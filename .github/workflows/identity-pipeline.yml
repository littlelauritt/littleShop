name: Identity API CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'littleShop.identity/**'
      - 'littleShop.Shared/**'
      - 'littleshop.serviceDefaults/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'tests/**'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Quitamos IMAGE_NAME de aquí porque lo vamos a calcular dinámicamente en minúsculas abajo

jobs:
  # -----------------------------------------------------------------
  # TRABAJO 1: BUILD & TEST
  # -----------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 Preview
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore Dependencies
      run: dotnet restore littleShop.identity/littleShop.identity.csproj

    - name: Build
      run: dotnet build littleShop.identity/littleShop.identity.csproj --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test littleShop.identity.Tests/littleShop.identity.Tests.csproj --verbosity normal

  # -----------------------------------------------------------------
  # TRABAJO 2: DOCKER & INTEGRATION
  # -----------------------------------------------------------------
  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    # --- PASO NUEVO: ELIMINAR MAYÚSCULAS ---
    # Esto coge 'littleShop' y lo convierte en 'littleshop' para que Docker no llore
    - name: Convert repository name to lowercase
      run: |
        echo "LOWERCASE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./littleShop.identity/Dockerfile
        push: true
        # Usamos la variable nueva en minúsculas
        tags: ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/identity-api:latest

    - name: Run Integration Tests (Docker Compose)
      run: |
        # 1. Ajustar el docker-compose para usar la imagen correcta
        # Como docker-compose.yml suele apuntar a local, forzamos la imagen del registry
        export IDENTITY_IMAGE=${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/identity-api:latest
        
        # 2. Arrancar entorno
        docker compose up -d --build
        
        # 3. Esperar
        echo "⏳ Esperando 15 segundos..."
        sleep 15
        
        # 4. Instalar y lanzar Newman
        npm install -g newman
        newman run ./tests/identity-api-test.json
        
        # 5. Limpiar
        docker compose down