name: Identity API CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'littleShop.identity/**'
      - 'littleShop.Shared/**'
      - 'littleshop.serviceDefaults/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'tests/**'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10 Preview
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    - name: Restore Dependencies
      run: dotnet restore littleShop.identity/littleShop.identity.csproj
    - name: Build
      run: dotnet build littleShop.identity/littleShop.identity.csproj --no-restore -c Release
    - name: Run Unit Tests
      run: dotnet test littleShop.identity.Tests/littleShop.identity.Tests.csproj --verbosity normal

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Convert repository name to lowercase
      run: |
        echo "LOWERCASE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./littleShop.identity/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/identity-api:latest
    - name: Run Integration Tests (Docker Compose)
      run: |
        export IDENTITY_IMAGE=${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/identity-api:latest
        
        docker compose up -d --build identity-api identity-db identity-rabbitmq
        
        echo "⏳ Esperando 15 segundos..."
        sleep 15
        
        npm install -g newman
        newman run ./tests/identity-api-test.json --env-var baseUrl=http://localhost:5001
        
        docker compose down