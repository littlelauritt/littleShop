name: Orders Service CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'littleShop.orders/**'
      - 'littleShop.Shared/**'
      - 'littleshop.serviceDefaults/**'
      - '.github/workflows/orders-pipeline.yml'
      - 'docker-compose.yml'
      - 'tests/orders-api-test.json'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 Preview
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore Dependencies
      run: dotnet restore littleShop.orders/littleShop.orders.csproj

    - name: Build
      run: dotnet build littleShop.orders/littleShop.orders.csproj --no-restore -c Release

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Convert repository name to lowercase
      run: |
        echo "LOWERCASE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./littleShop.orders/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/orders-api:latest

    - name: Run Integration Tests (Docker Compose)
      run: |
        # Usamos las imágenes del registry
        export ORDERS_IMAGE=${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/orders-api:latest
        
        # Arrancamos TODO (Identity + Catalog + Orders + DBs)
        docker compose up -d --build
        
        echo "⏳ Esperando 20 segundos para que todo arranque..."
        sleep 20
        
        # Primero registramos un usuario en Identity para que el Login funcione
        # (Esto es un truco rápido usando curl)
        curl -X POST http://localhost:5001/api/Account/register \
             -H "Content-Type: application/json" \
             -d '{"email":"admin@test.com", "password":"Pass123$!"}'
        
        npm install -g newman
        # Ejecutamos el test contra el puerto 5003 (Orders)
        newman run ./tests/orders-api-test.json --env-var baseUrl=http://localhost:5003
        
        docker compose down