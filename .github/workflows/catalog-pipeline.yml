name: Catalog Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'littleShop.catalog/**'
      - 'littleShop.Shared/**'
      - 'littleshop.serviceDefaults/**'
      - '.github/workflows/catalog-pipeline.yml'
      - 'docker-compose.yml'
      - 'tests/catalog-api-test.json'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10 Preview
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore Dependencies
      run: dotnet restore littleShop.catalog/littleShop.catalog.csproj

    - name: Build
      run: dotnet build littleShop.catalog/littleShop.catalog.csproj --no-restore -c Release

    # Si tienes tests unitarios de catálogo, descomenta esto:
    # - name: Run Unit Tests
    #   run: dotnet test littleShop.catalog.Tests/littleShop.catalog.Tests.csproj --verbosity normal

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    # Convertir a minúsculas para Docker
    - name: Convert repository name to lowercase
      run: |
        echo "LOWERCASE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./littleShop.catalog/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/catalog-api:latest

    - name: Run Integration Tests (Docker Compose)
      run: |
        # 1. Forzar uso de imágenes del registry
        export CATALOG_IMAGE=${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/catalog-api:latest
        
        # 2. Arrancar entorno
        docker compose up -d --build
        
        # 3. Esperar
        echo "⏳ Esperando 60 segundos (GitHub es lento)..."
        sleep 60
        
        # 4. Test con Newman (OJO AL PUERTO 5002)
        npm install -g newman
        newman run ./tests/catalog-api-test.json --env-var baseUrl=http://localhost:5002
        
        # 5. Limpiar
        docker compose down