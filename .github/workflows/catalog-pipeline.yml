name: Catalog Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'littleShop.catalog/**'
      - 'littleShop.Shared/**'
      - 'littleshop.serviceDefaults/**'
      - '.github/workflows/catalog-pipeline.yml'
      - 'docker-compose.yml'
      - 'tests/catalog-api-test.json'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10 Preview
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    - name: Restore Dependencies
      run: dotnet restore littleShop.catalog/littleShop.catalog.csproj
    - name: Build
      run: dotnet build littleShop.catalog/littleShop.catalog.csproj --no-restore -c Release
    # HE AÑADIDO ESTO PARA QUE VERIFIQUE TUS TESTS ARREGLADOS
    - name: Run Unit Tests
      run: dotnet test littleShop.catalog.Tests/littleShop.catalog.Tests.csproj --verbosity normal

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Convert repository name to lowercase
      run: |
        echo "LOWERCASE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./littleShop.catalog/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/catalog-api:latest
    - name: Run Integration Tests (Docker Compose)
      run: |
        export CATALOG_IMAGE=${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}/catalog-api:latest
        
        docker compose up -d --build catalog-api catalog-db
        
        echo "⏳ Esperando 60 segundos..."
        sleep 60
        
        # 🕵️‍♂️ MODO DETECTIVE ACTIVADO 🕵️‍♂️
        echo "==== 🔍 ESTADO DE LOS CONTENEDORES ===="
        docker ps -a
        echo "==== 📜 LOGS DE CATALOG-API (EL CULPABLE) ===="
        docker logs catalog-api || echo "No se pudieron obtener logs de catalog-api"
        echo "==== 📜 LOGS DE CATALOG-DB ===="
        docker logs catalog-db || echo "No se pudieron obtener logs de catalog-db"
        echo "==================================="
        
        npm install -g newman
        newman run ./tests/catalog-api-test.json --env-var baseUrl=http://localhost:5002
        
        docker compose down

