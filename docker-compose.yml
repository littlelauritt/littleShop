version: '3.8'

services:
  # ===============================================================================
  # BASES DE DATOS (PostgreSQL)
  # ===============================================================================
  identity-db:
    image: postgres:16-alpine
    container_name: identity-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=identitydb
    ports:
      - "5432:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identitydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=catalogdb
    ports:
      - "5433:5432"  # Puerto diferente para evitar conflictos
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ordersdb
    ports:
      - "5434:5432"  # Puerto diferente para evitar conflictos
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===============================================================================
  # MENSAJERÍA (RabbitMQ) - Compartido por todos los servicios
  # ===============================================================================
  identity-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: identity-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===============================================================================
  # APIS
  # ===============================================================================
  
  # --- IDENTITY API ---
  identity-api:
    build:
      context: .
      dockerfile: littleShop.identity/Dockerfile
    container_name: identity-api
    restart: on-failure
    depends_on:
      identity-db:
        condition: service_healthy
      identity-rabbitmq:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__identitydb=Host=identity-db;Database=identitydb;Username=postgres;Password=postgres
      - ConnectionStrings__messaging=amqp://guest:guest@identity-rabbitmq:5672
      - Jwt__Issuer=littleShop-test
      - Jwt__Audience=littleShop-test
      - Jwt__Key=EstaEsUnaClaveSecretaMuyLargaYSegura123!

  # --- CATALOG API ---
  catalog-api:
    build:
      context: .
      dockerfile: littleShop.catalog/Dockerfile
    container_name: catalog-api
    restart: on-failure
    depends_on:
      catalog-db:
        condition: service_healthy
      identity-rabbitmq:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__catalogdb=Host=catalog-db;Database=catalogdb;Username=postgres;Password=postgres
      - ConnectionStrings__messaging=amqp://guest:guest@identity-rabbitmq:5672

# --- ORDERS API ---
  orders-api:
    build:
      context: .
      dockerfile: littleShop.orders/Dockerfile
    container_name: orders-api
    restart: on-failure
    depends_on:
      orders-db:
        condition: service_healthy
      identity-rabbitmq:
        condition: service_healthy
      identity-api:
        condition: service_started
      catalog-api:
        condition: service_started
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ordersdb=Host=orders-db;Database=ordersdb;Username=postgres;Password=postgres
      - ConnectionStrings__messaging=amqp://guest:guest@identity-rabbitmq:5672
      - Jwt__Issuer=littleShop-test
      - Jwt__Audience=littleShop-test
      - Jwt__Key=EstaEsUnaClaveSecretaMuyLargaYSegura123!

 
  # --- NOTIFICATIONS (Worker Service) ---
  notifications:
    build:
      context: .
      dockerfile: littleShop.notifications/Dockerfile
    container_name: littleshop-notifications
    restart: on-failure
    depends_on:
      identity-rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__messaging=amqp://guest:guest@identity-rabbitmq:5672
      - SMTP_HOST=localhost:1025
      - AdminEmail=admin@littleshop.com

volumes:
  identity_postgres_data:
  catalog_postgres_data:
  orders_postgres_data: